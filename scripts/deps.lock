# Pinned dependencies. scripts/fetch-deps.sh, scripts/preflight.sh and
# scripts/gen-pins-table.mjs read this file; it is the only hand-edited source of pins.
#
# Format (whitespace-separated, same shape as cartwheel-examples scripts/deps.lock):
#   name                     source                                   revision            [sha256 | full commit]
# A git source pins "<revision>" or "<version tag> <full commit hash>"; the hash is what is checked out.
# An archive source pins "<version> <sha256>"; fetch-deps.sh refuses an archive whose sha256 differs.
# observed:* lines record a host the project does not install; nothing fetches them.

# cartwheel-engine: source at the v0.15.1 commit (its tools/run-cart.mjs and tests/gate.mjs).
# Commit: `git ls-remote --tags` peeled ref refs/tags/v0.15.1^{} (the tag object itself is c53bddcd5260beca62f1cd14aa9f8c456438466b).
cartwheel-engine   https://github.com/monteslu/cartwheel-engine.git   v0.15.1   4a5f73e8542b0069dc0689d026fd73c399a13907

# Prebuilt engine SDKs of v0.15.1 (cartwheel-engine docs/sdk.md). sha256 = the release's .sha256 asset;
# it equals the GitHub release asset digest for the tarball.
#   macos-arm64: Darwin-executable (clang + static libs, bin/cwpack, programs.mjs, three.c tools)
#   cart:        target-only wasm32-wasip1-threads libraries (ThinLTO bitcode), wasmcart-pack, import checker
#   cart-wgpu:   the same plus emdawnwebgpu and wasmcart-wgpu; builds the dual (GL + WebGPU) carts.
#                Its sha256 is the GitHub release asset digest (`gh release view v0.15.1 -R monteslu/cartwheel-engine --json assets`).
cartwheel-sdk:macos-arm64 https://github.com/monteslu/cartwheel-engine/releases/download/v0.15.1/cartwheel-sdk-0.15.1-macos-arm64.tar.gz v0.15.1 7615869aa000b97dd37a54964b358e28a1ebbc7a5c1290a342840257424df047
cartwheel-sdk:cart        https://github.com/monteslu/cartwheel-engine/releases/download/v0.15.1/cartwheel-sdk-0.15.1-cart.tar.gz        v0.15.1 00780dcbed82517aea76784c64a91415ca913d7af6fd39966b5c5de7843d950b
cartwheel-sdk:cart-wgpu   https://github.com/monteslu/cartwheel-engine/releases/download/v0.15.1/cartwheel-sdk-0.15.1-cart-wgpu.tar.gz   v0.15.1 777167301a0afaf515ef78e1ca3514ceac3ff9f1c3eade7d92ced36e8d57d4a7

