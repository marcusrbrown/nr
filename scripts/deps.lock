wasmcart-wgpu      https://github.com/wasmcart/wasmcart.git            v0.34.3   cd233ea13c5656634898a925c214e3aea0558884

# Cart toolchain for Darwin arm64 (Darwin-executable). The engine's lock pins the x86_64-linux builds of
# the same versions (wasi-sdk 33.0, Binaryen 123); the cart SDK's own fetch script cannot fetch these on macOS.
