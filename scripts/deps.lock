wasi-sdk:darwin-arm64  https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-arm64-macos.tar.gz            33.0  85c997a2665ead91673b5bb88b7d0df3fc8900df3bfa244f720d478187bbdc78
binaryen:darwin-arm64  https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-arm64-macos.tar.gz    123   74428be348c1a09863e7b642a1fa948cabf8ec9561052233d8288e941951725b

